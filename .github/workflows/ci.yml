name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Web-Commit der Golden-Vektoren lesen
        id: webcommit
        shell: bash
        run: echo "sha=$(tr -d '[:space:]' < tools/golden/web-commit.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web-Theme auschecken (Quelle der Golden-Vektoren)
        uses: actions/checkout@v4
        with:
          repository: lorenzhdr/LenzFlix
          ref: ${{ steps.webcommit.outputs.sha }}
          path: web-theme
      - name: Golden-Vektoren erzeugen
        shell: bash
        env:
          LENZFLIX_WEB_DIR: ${{ github.workspace }}/web-theme
        run: node tools/golden/gen.mjs
      - name: Tests
        shell: bash
        env:
          LFX_GOLDEN_REQUIRED: "1"
        run: cargo test --workspace

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Geheimnisse (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Markenprüfung
        run: sh tools/check-brands.sh
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
