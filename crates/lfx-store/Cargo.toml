[package]
name = "lfx-store"
description = "Lokale SQLite-Datenbank für LENZFLIX Desktop: Cache, Einstellungen, Outbox, Bild-Index"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
