[package]
name = "lfx-devcli"
description = "Entwickler-Werkzeug lfx-dev: Anmeldung per Quick Connect und Live-Prüflauf (g4) für LENZFLIX Desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "lfx_devcli"

[[bin]]
name = "lfx-dev"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
lfx-api = { path = "../lfx-api" }
lfx-platform = { path = "../lfx-platform" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
lfx-mock-jellyfin = { path = "../lfx-mock-jellyfin" }
tempfile = "3"
