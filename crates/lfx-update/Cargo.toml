[package]
name = "lfx-update"
description = "Auto-Update für LENZFLIX Desktop: GitHub-Releases, SHA-256 + Minisign, stille Installation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
minisign-verify = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "time", "rt"] }
tracing = "0.1"

[dev-dependencies]
base64 = "0.23"
blake2 = "0.10"
ed25519-dalek = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "fs"] }
