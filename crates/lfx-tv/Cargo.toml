[package]
name = "lfx-tv"
description = "UI-freie Logik des LENZFLIX-TV-Modus (Zustandsmaschine, EPG-Modell, Katalog-Laden) auf Basis des bitgleichen Planers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
lfx-tv-schedule = { path = "../lfx-tv-schedule" }
lfx-api = { path = "../lfx-api" }
indexmap = "2"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2"
unicode-normalization = "0.1"

[dev-dependencies]
lfx-mock-jellyfin = { path = "../lfx-mock-jellyfin" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "time"] }
