[package]
name = "lfx-app"
description = "LENZFLIX Desktop: die Anwendung (verbindet Shell, Oberfläche, Sitzung, Player und Navigation)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "lfx_app"

[[bin]]
name = "lenzflix"
path = "src/main.rs"

[features]
default = []
# Entwickler-Steuerung über einen lokalen TCP-Port (nur 127.0.0.1) für Tests und Screenshots.
dev-automation = []

[dependencies]
lfx-api = { path = "../lfx-api" }
lfx-core = { path = "../lfx-core" }
lfx-images = { path = "../lfx-images" }
lfx-nav = { path = "../lfx-nav", features = ["gamepad"] }
lfx-platform = { path = "../lfx-platform" }
lfx-player = { path = "../lfx-player" }
lfx-retro-fx = { path = "../lfx-retro-fx" } # W3-retro
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] } # W3-retro
lfx-session = { path = "../lfx-session" }
lfx-shell = { path = "../lfx-shell" }
lfx-store = { path = "../lfx-store" }
lfx-tv = { path = "../lfx-tv" } # W2-tvui
lfx-tv-schedule = { path = "../lfx-tv-schedule" } # W2-tvui
lfx-update = { path = "../lfx-update" } # W5-tray
lfx-ui = { path = "../lfx-ui" }
png = "0.17"
serde = { version = "1", features = ["derive"] } # W5-tray
serde_json = "1"
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# W5-tray: Infobereich-Symbol (ohne Linux-Standardfeature libappindicator, damit GTK nicht in den Baum kommt)
tray-icon = { version = "0.26.1", default-features = false }

[dev-dependencies]
lfx-app = { path = ".", features = ["dev-automation"] }
lfx-mock-jellyfin = { path = "../lfx-mock-jellyfin" }
minisign = "0.10" # W5-tray: Testpaket für den Update-E2E signieren
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }

[[test]]
name = "e2e"
required-features = ["dev-automation"]

[[test]] # W2-tvui
name = "e2e_tvui"
required-features = ["dev-automation"]

# W2-player: Player-E2E (eigene Datei, damit sie nicht mit e2e.rs kollidiert)
[[test]]
name = "e2e_player"
required-features = ["dev-automation"]

[[test]] # W2-detail
name = "e2e_detail"
required-features = ["dev-automation"]

[[test]] # W4-media
name = "w4_media"
required-features = ["dev-automation"]

[[test]] # W2-home
name = "home_e2e"
required-features = ["dev-automation"]

[[test]] # W3-plus
name = "w3_plus"
required-features = ["dev-automation"]

[[test]] # W3-prime
name = "prime_e2e"
required-features = ["dev-automation"]

[[test]] # W3-retro
name = "e2e_retro"
required-features = ["dev-automation"]

[[test]] # W3-picker
name = "w3_picker"
required-features = ["dev-automation"]

[[test]] # W4-account
name = "account_e2e"
required-features = ["dev-automation"]

[build-dependencies]
winresource = "0.1.34" # W5-tray: Symbol und Versionsangaben in der exe

[[test]] # W5-tray
name = "w5_tray"
required-features = ["dev-automation"]
