[package]
name = "lfx-platform"
description = "Plattformdienste für LENZFLIX Desktop: Schlüsselbund, Ordner, lokale Konfiguration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
directories = "6"
keyring-core = "1"
lfx-api = { path = "../lfx-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"

# W2-player: Medientasten (SMTC) und Energiesparen.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Media",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_System_WinRT",
]

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[dev-dependencies]
tempfile = "3"
