[package]
name = "lfx-shell"
description = "Hauptfenster von LENZFLIX Desktop: rahmenloses Fenster, Video-/UI-Komposition, Hit-Test"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = "2"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

# Windows: eigene Slint-Plattform mit wgpu (DX12) auf einem DirectComposition-Visual.
[target.'cfg(windows)'.dependencies]
slint = { version = "1.19", default-features = false, features = [
    "std",
    "compat-1-2",
    "renderer-femtovg-wgpu",
    "renderer-software",
    "unstable-wgpu-30",
] }
# Gleiche Version wie Slint: Cursor-/IME-Weitergabe laufen über die interne Adapter-Schnittstelle.
i-slint-core = { version = "=1.19.0", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# Sonst (macOS, CI): das normale Slint-winit-Backend, kein Video-Layer.
[target.'cfg(not(windows))'.dependencies]
slint = { version = "1.19", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg-wgpu",
    "renderer-software",
    "unstable-winit-030",
] }
