[package]
name = "lfx-remote"
description = "Fernsteuerung und SyncPlay (Jellyfin-Session-WebSocket) für LENZFLIX Desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
lfx-api = { path = "../lfx-api" }
reqwest = { version = "0.13", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "time", "rt", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["connect", "rustls-tls-native-roots"] }
tracing = "0.1"

[dev-dependencies]
lfx-mock-jellyfin = { path = "../lfx-mock-jellyfin" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
