[package]
name = "lfx-offline"
description = "Offline-Modus für LENZFLIX Desktop: Download-Manager, Offline-Bibliothek, Fortschritt offline und Abgleich"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fs4 = "1"
lfx-api = { path = "../lfx-api" }
lfx-platform = { path = "../lfx-platform" }
lfx-player = { path = "../lfx-player" }
lfx-store = { path = "../lfx-store" }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
lfx-mock-jellyfin = { path = "../lfx-mock-jellyfin" }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
