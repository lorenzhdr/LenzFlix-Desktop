[package]
name = "lfx-player"
description = "Wiedergabe-Kern (libmpv) für LENZFLIX Desktop: Player, Video-Ausgabe, PlaybackInfo, Fortschrittsmeldungen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
lfx-api = { path = "../lfx-api" }
lfx-mpv-sys = { path = "../lfx-mpv-sys" }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
lfx-mock-jellyfin = { path = "../lfx-mock-jellyfin" }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "time", "macros", "net", "io-util", "test-util"] }
